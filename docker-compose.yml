name: soundmates-be-prj

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: soundmates-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    # ⚠️ KHÔNG expose port 5432 ra internet - chỉ dùng nội bộ Docker network
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    networks:
      - soundmates-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Read Database for Query Service)
  mongodb:
    image: mongo:7.0
    container_name: soundmates-mongodb
    environment:
      MONGO_INITDB_DATABASE: auth_query
    # ⚠️ KHÔNG expose port 27017 ra internet - chỉ dùng nội bộ Docker network
    # ports:
    #   - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - soundmates-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: soundmates-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # ⚠️ KHÔNG expose AMQP port 5672 ra internet
    # Management UI 15672 chỉ nên truy cập qua SSH tunnel nếu cần
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - soundmates-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Command)
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/AuthService.Api/Dockerfile
    container_name: soundmates-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${AUTH_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Ssl Mode=Disable;Trust Server Certificate=True;
      - ConnectionStrings__MongoDb=${MONGODB_CONNECTION_STRING}
      - Mongo__Database=${MONGODB_DATABASE}
      - RabbitMq__HostName=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__UserName=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiresInHours=${JWT_EXPIRES_IN_HOURS}
      - GoogleOAuth__ClientId=${GOOGLE_CLIENT_ID}
      - GoogleOAuth__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - EmailSettings__Host=${EMAIL_HOST}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__From=${EMAIL_FROM}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - AppSettings__FrontendUrl=${FRONTEND_URL}
      - Spotify__ClientId=${SPOTIFY_CLIENT_ID}
      - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET}
      - Spotify__RedirectUri=${SPOTIFY_REDIRECT_URI}
    volumes:
      - auth-service-dp-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "8001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Auth Query Service (Query)
  auth-query-service:
    build:
      context: ./services/auth-query-service
      dockerfile: AuthQueryService.Api/Dockerfile
    container_name: soundmates-auth-query-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${AUTH_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Ssl Mode=Disable;Trust Server Certificate=True;
      - ConnectionStrings__MongoDb=${MONGODB_CONNECTION_STRING}
      - Mongo__Database=${MONGODB_DATABASE}
      - RabbitMq__HostName=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__UserName=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiresInHours=${JWT_EXPIRES_IN_HOURS}
      - Spotify__ClientId=${SPOTIFY_CLIENT_ID}
      - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET}
    volumes:
      - auth-query-service-dp-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "8002:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # AI Service (Script + TTS)
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/AiService.Api/Dockerfile
    container_name: soundmates-ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${AI_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Ssl Mode=Disable;Trust Server Certificate=True;
      - RabbitMq__HostName=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__UserName=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Llm__Provider=${LLM_PROVIDER}
      - Llm__BaseUrl=${LLM_BASE_URL}
      - Llm__ApiKey=${LLM_API_KEY}
      - Llm__Model=${LLM_MODEL}
      - Tts__Provider=${TTS_PROVIDER}
      - Tts__BaseUrl=${TTS_BASE_URL}
      - Tts__ApiKey=${TTS_API_KEY}
      - Tts__SynthesizePath=${TTS_SYNTHESIZE_PATH}
      - Tts__AudioFormat=${TTS_AUDIO_FORMAT}
      - Tts__TimeoutSeconds=${TTS_TIMEOUT_SECONDS:-600}
      - TTS_TIMEOUT_SECONDS=${TTS_TIMEOUT_SECONDS:-600}
      - Tts__DemoMode=${TTS_DEMO_MODE}
      - Storage__AudioRoot=/app/data/audios
      - Storage__PublicBaseUrl=${AI_PUBLIC_BASE_URL}
      # Tell TTS client inside the container where the cloned voices file lives
      - VIENEUTTS_CLONED_VOICES_FILE=/app/data/cloned_voices.json
    ports:
      - "8067:8080"
    volumes:
      - ai-audios-data:/app/data/audios
      - type: bind
        source: ../soundmates-vieneu-tts/data
        target: /app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Live Session Service
  live-session-service:
    build:
      context: .
      dockerfile: services/live-session-service/LiveSessionService.Api/Dockerfile
    container_name: soundmates-live-session-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${LIVE_SESSION_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Ssl Mode=Disable;Trust Server Certificate=True;
      - RabbitMq__HostName=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__UserName=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - AzuraCast__BaseUrl=${AZURACAST_BASE_URL}
      - AzuraCast__ApiKey=${AZURACAST_API_KEY}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    ports:
      - "8003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Account Content Service
  account-content-service:
    build:
      context: .
      dockerfile: services/account-content-service/AccountContentService.Api/Dockerfile

    container_name: soundmates-account-content-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${ACCOUNT_CONTENT_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Ssl Mode=Disable;Trust Server Certificate=True;
      - RabbitMq__HostName=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__UserName=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      - VNPay__BaseUrl=${VNPAY_BASE_URL}
      - VNPay__BaseUrlProd=${VNPAY_BASE_URL_PROD}
      - VNPay__ReturnUrl=${VNPAY_RETURN_URL}
      - PayOS__ClientId=${PAY_OS_CLIENT_ID}
      - PayOS__ApiKey=${PAY_OS_API_KEY}
      - PayOS__ChecksumKey=${PAY_OS_CHECKSUM_KEY}
      - PayOS__BaseUrl=${PAY_OS_BASE_URL}
      - PayOS__SandboxBaseUrl=${PAY_OS_BASE_URL_SANDBOX}
      - PayOS__ReturnUrl=${PAY_OS_RETURN_URL}
      - AESEncryption__Key=${AES_KEY}
      - AESEncryption__IV=${AES_IV}
      - AppSettings__FrontendUrl=${FRONTEND_URL}
      - AppSettings__BaseUrl=${BASE_URL}
      - LiveSessionService__BaseUrl=http://soundmates-live-session-service:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: soundmates-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/ocelot.json:/app/ocelot.json:ro
    depends_on:
      - auth-service
      - auth-query-service
      - live-session-service
      - account-content-service
    networks:
      - soundmates-network
    restart: unless-stopped

  # ─── TURN Server (Coturn) ───────────────────────────────────────────────────
  # Dùng để relay WebRTC audio (Host Mic → Listeners) khi NAT/Firewall chặn P2P
  coturn:
    image: coturn/coturn:latest
    container_name: soundmates-coturn
    # host networking bắt buộc để TURN hoạt động đúng — UDP cần bind IP thực
    network_mode: host
    restart: unless-stopped
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --tls-listening-port=5349
      --relay-ip=${TURN_RELAY_IP}
      --external-ip=${TURN_EXTERNAL_IP}/${TURN_RELAY_IP}
      --min-port=49152
      --max-port=65535
      --realm=soundmates.xyz
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255

networks:
  soundmates-network:
    driver: bridge

volumes:
  # external: true = Docker Compose dùng volume đã có sẵn, KHÔNG tạo mới
  # name cố định = không bị đổi khi project name thay đổi
  postgres-data:
    name: soundmates_postgres_data
    external: true
  mongodb-data:
    name: soundmates_mongodb_data
    external: true
  rabbitmq-data:
    name: soundmates_rabbitmq_data
    external: true
  ai-audios-data:
    name: soundmates_ai_audios_data
    external: true
  # DataProtection Keys - persist JWT signing keys across restarts
  auth-service-dp-keys:
    name: soundmates_auth_service_dp_keys
  auth-query-service-dp-keys:
    name: soundmates_auth_query_service_dp_keys
