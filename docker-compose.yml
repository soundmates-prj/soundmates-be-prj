services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: soundmates-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/00-init-multiple-dbs.sql
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Read Database for Query Service)
  mongodb:
    image: mongo:7.0
    container_name: soundmates-mongodb
    environment:
      MONGO_INITDB_DATABASE: auth_query
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: soundmates-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Command)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: AuthService.Api/Dockerfile
    container_name: soundmates-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-auth_db}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VIRTUALHOST=${RABBITMQ_VIRTUALHOST:-/}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-Soundmates.Auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Soundmates.Users}
      - JWT_EXPIRES_IN_HOURS=${JWT_EXPIRES_IN_HOURS:-48}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-auth_query}
    ports:
      - "8001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Auth Query Service (Query)
  auth-query-service:
    build:
      context: ./services/auth-query-service
      dockerfile: AuthQueryService.Api/Dockerfile
    container_name: soundmates-auth-query-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-auth_db}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-auth_query}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VIRTUALHOST=${RABBITMQ_VIRTUALHOST:-/}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-Soundmates.Auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Soundmates.Users}
      - JWT_EXPIRES_IN_HOURS=${JWT_EXPIRES_IN_HOURS:-48}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    ports:
      - "8002:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # AI Service (Script + TTS)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: AiService.Api/Dockerfile
    container_name: soundmates-ai-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DATABASE=${AI_POSTGRES_DATABASE:-ai_db}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-Soundmates.Auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Soundmates.Users}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - TTS_PROVIDER=${TTS_PROVIDER:-vienetts}
      - TTS_BASE_URL=${TTS_BASE_URL:-http://host.docker.internal:23333}
      - TTS_API_KEY=${TTS_API_KEY}
      - TTS_SYNTHESIZE_PATH=${TTS_SYNTHESIZE_PATH:-/v1/chat/completions}
      - TTS_AUDIO_FORMAT=${TTS_AUDIO_FORMAT:-mp3}
      - TTS_TIMEOUT_SECONDS=${TTS_TIMEOUT_SECONDS:-60}
      - TTS_DEMO_MODE=${TTS_DEMO_MODE:-true}
      - AUDIO_STORAGE_ROOT=/app/data/audios
      - PUBLIC_BASE_URL=${AI_PUBLIC_BASE_URL:-http://localhost:8067}
    ports:
      - "8067:8080"
    volumes:
      - ai-audios-data:/app/data/audios
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Live Session Service
  live-session-service:
    build:
      context: ./services/live-session-service
      dockerfile: LiveSessionService.Api/Dockerfile
    container_name: soundmates-live-session-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DATABASE=${LIVE_SESSION_POSTGRES_DATABASE:-live_session_db}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VIRTUALHOST=${RABBITMQ_VIRTUALHOST:-/}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-Soundmates.Auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Soundmates.Users}
      - AZURACAST_BASE_URL=${AZURACAST_BASE_URL:-http://azuracast:8080}
      - AZURACAST_API_KEY=${AZURACAST_API_KEY}
    ports:
      - "8003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Account Content Service
  account-content-service:
    build:
      context: ./services/account-content-service
      dockerfile: AccountContentService.Api/Dockerfile

    env_file:
      - ./services/account-content-service/AccountContentService.Api/.env

    container_name: soundmates-account-content-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DATABASE=${ACCOUNT_CONTENT_POSTGRES_DATABASE:-account_content_db}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VIRTUALHOST=${RABBITMQ_VIRTUALHOST:-/}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-Soundmates.Auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Soundmates.Users}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_BASE_URL=${VNPAY_BASE_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
    ports:
      - "8004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: soundmates-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - auth-query-service
      - live-session-service
    networks:
      - soundmates-network
    restart: unless-stopped

networks:
  soundmates-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
  ai-audios-data:
