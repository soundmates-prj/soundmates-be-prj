services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: soundmates-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Read Database for Query Service)
  mongodb:
    image: mongo:7.0
    container_name: soundmates-mongodb
    environment:
      MONGO_INITDB_DATABASE: auth_query
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: soundmates-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - soundmates-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Command)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: AuthService.Api/Dockerfile
    container_name: soundmates-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=auth_db
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VIRTUALHOST=/
      - JWT_KEY=THIS_IS_A_MUCH_LONGER_AND_MORE_SECURE_SUPER_SECRET_KEY_123456789
      - JWT_ISSUER=Soundmates.Auth
      - JWT_AUDIENCE=Soundmates.Users
      - JWT_EXPIRES_IN_HOURS=48
      - GOOGLE_CLIENT_ID=93259588882-152q42sdkspqdv5e1t0ljjrq4gtkr3ka.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_FROM=tranthinh5801@gmail.com
      - EMAIL_USERNAME=tranthinh5801@gmail.com
      - EMAIL_PASSWORD=jbup rszt ukjz oodx
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # Auth Query Service (Query)
  auth-query-service:
    build:
      context: ./services/auth-query-service
      dockerfile: AuthQueryService.Api/Dockerfile
    container_name: soundmates-auth-query-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=auth_db
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - MONGODB_CONNECTION_STRING=mongodb://mongodb:27017
      - MONGODB_DATABASE=auth_query
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VIRTUALHOST=/
      - JWT_KEY=THIS_IS_A_MUCH_LONGER_AND_MORE_SECURE_SUPER_SECRET_KEY_123456789
      - JWT_ISSUER=Soundmates.Auth
      - JWT_AUDIENCE=Soundmates.Users
      - JWT_EXPIRES_IN_HOURS=48
    ports:
      - "8002:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - soundmates-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: soundmates-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - auth-query-service
    networks:
      - soundmates-network
    restart: unless-stopped

networks:
  soundmates-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
